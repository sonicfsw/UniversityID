<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive SVG</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .highlighted {
            fill: yellow;
        }
        .cls-1 {
            fill: #fff;
            stroke: #000;
            stroke-miterlimit: 10;
        }
        .cls-2 {
            font-size: 24px;
            fill: #000;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <h1>Interactive Auditorium Map</h1>
    <div id="auditorium-data">
        <h2>Selected Auditorium Info</h2>
        <div id="auditorium-info"></div>
    </div>
    <?xml version="1.0" encoding="utf-8"?>
    <svg height="auto" viewBox="0 0 1018 907" width="auto">
        <!-- Auditorium 207 -->
        <g id="207" onclick="loadAuditoriumData('207')">
            <path class="cls-1" d="M833.3,471.2h-92.7c-2.7,0-4.8,2.2-4.8,4.8v84.7c0,2.7,2.2,4.8,4.8,4.8h92.7c2.7,0,4.8-2.2,4.8-4.8V476C838.1,473.4,836,471.2,833.3,471.2z"/>
            <text class="cls-2" transform="matrix(1 0 0 1 768.662 524.8025)">207</text>
        </g>

        <!-- Auditorium 208 -->
        <g id="208" onclick="loadAuditoriumData('208')">
            <path class="cls-1" d="M659.1,422.5h-86.6c-2.7,0-4.8,2.2-4.8,4.8v63.1c0,2.7,2.2,4.8,4.8,4.8h86.6c2.7,0,4.8-2.2,4.8-4.8v-63.1C663.9,424.7,661.8,422.5,659.1,422.5z"/>
            <text class="cls-2" transform="matrix(1 0 0 1 595.4424 465.3349)">208</text>
        </g>

        <!-- Auditorium 209 -->
        <g id="209" onclick="loadAuditoriumData('209')">
            <path class="cls-1" d="M833.3,310.1h-92.7c-2.7,0-4.8,2.2-4.8,4.8v132.9c0,2.7,2.2,4.8,4.8,4.8h92.7c2.7,0,4.8-2.2,4.8-4.8V314.9C838.1,312.2,836,310.1,833.3,310.1z"/>
            <text class="cls-2" transform="matrix(1 0 0 1 768.1662 388.7905)">209</text>
        </g>
        
        <!-- Add more auditoriums similarly -->
    </svg>

    <script>
        // Load data for a specific auditorium
        function loadAuditoriumData(auditoriumId) {
            $.get(`/auditoriums`, function(data) {
                const auditorium = data.find(a => a.AuditoriumNumber === auditoriumId);
                if (auditorium) {
                    let info = `
                        <p><strong>Auditorium ID:</strong> ${auditorium.Auditorium_ID}</p>
                        <p><strong>Level:</strong> ${auditorium.Level}</p>
                        <p><strong>Building Name:</strong> ${auditorium.BuildingName}</p>
                        <p><strong>Capacity:</strong> ${auditorium.Capacity}</p>
                        <p><strong>Type:</strong> ${auditorium.AuditoriumType}</p>
                    `;
                    $('#auditorium-info').html(info);
                } else {
                    $('#auditorium-info').html('<p>No data found for this auditorium.</p>');
                }
            });
        }
    </script>
</body>
</html>
